<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Director de Boxes</title>
<style>
:root{--bg:#f6f6f8;--fg:#1b1b1f;--card:#fff;--mut:#6b6b76;--bd:#dcdce2;--acc:#e10600;--ok:#1a8f4a;--bad:#c0392b;--hl:#fff3d6;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101014;--fg:#ececf1;--card:#1b1b22;--mut:#9a9aa8;--bd:#33333d;--hl:#3a3220}}
:root[data-theme="dark"]{--bg:#101014;--fg:#ececf1;--card:#1b1b22;--mut:#9a9aa8;--bd:#33333d;--hl:#3a3220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:820px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.sm{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 11px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.big{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;padding:10px 16px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:5px 7px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}tr.me td{background:var(--hl)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
</style>
<style id="mini-manager-f1-redesign">

/* =========================================================
   DIRECTOR DE BOXES — REDISEÑO VISUAL RACING / MOTORSPORT
   Solo CSS: no altera reglas, datos, controles ni JavaScript.
   Inspiración general: paddock, telemetría y broadcast.
   ========================================================= */
:root{
  --bg:#090d13;
  --fg:#f4f6f8;
  --card:#151b24;
  --mut:#a6b0bd;
  --bd:#303b49;
  --acc:#e10600;
  --ok:#40d6a0;
  --bad:#ff5c67;
  --hl:#332019;
  color-scheme:dark;
}
html{background:#070a0f;}
body{
  min-height:100vh;
  color:var(--fg);
  font:14px/1.5 "Segoe UI",Arial,Helvetica,sans-serif;
  background:
    radial-gradient(ellipse at 85% -5%,rgba(225,6,0,.20),transparent 32rem),
    radial-gradient(ellipse at 0% 25%,rgba(0,162,255,.09),transparent 36rem),
    linear-gradient(145deg,#111823 0%,#080b10 55%,#111720 100%);
  background-attachment:fixed;
}
#app{
  max-width:1240px;
  margin:0 auto;
  padding:24px clamp(12px,2.5vw,32px) 48px;
  position:relative;
}
#app:before{
  content:"DIRECTOR DE BOXES  /  MODO JEFE DE EQUIPO";
  display:block;
  color:#aeb8c5;
  font-size:10px;
  font-weight:800;
  letter-spacing:.22em;
  margin:0 0 12px;
  padding:0 0 10px;
  border-bottom:1px solid #34404e;
}
#app:after{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#e10600 0 24%,#ff453a 24% 27%,#e9edf2 27% 27.5%,#263343 27.5% 100%);
}
h1{
  display:flex;align-items:center;gap:12px;
  font-size:clamp(26px,3.2vw,40px);
  line-height:1.05;letter-spacing:-.045em;
  font-weight:900;text-transform:uppercase;
  margin:4px 0 8px;
  text-shadow:0 3px 24px rgba(225,6,0,.16);
}
h1:after{
  content:"DB";display:inline-flex;align-items:center;justify-content:center;
  height:30px;min-width:42px;padding:0 8px;
  font-size:14px;font-style:italic;letter-spacing:.04em;
  color:white;background:var(--acc);border-radius:3px;
  transform:skew(-10deg);
}
h2{
  position:relative;
  font-size:14px;line-height:1.25;
  font-weight:850;text-transform:uppercase;letter-spacing:.075em;
  margin:0 0 13px;padding:0 0 10px 13px;
  border-bottom:1px solid #34404e;
  color:#f6f7f9;
}
h2:before{
  content:"";position:absolute;left:0;top:0;bottom:10px;width:4px;
  background:var(--acc);border-radius:2px;
}
.card{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(135deg,rgba(28,37,49,.98),rgba(17,23,32,.98));
  border:1px solid #354252;border-radius:8px;
  padding:clamp(13px,1.7vw,22px);
  margin:14px 0;
  box-shadow:0 12px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035);
}
.card:after{
  content:"";position:absolute;z-index:-1;right:-34px;top:-42px;
  width:130px;height:130px;opacity:.055;transform:rotate(35deg);
  background:repeating-linear-gradient(135deg,#fff 0 7px,transparent 7px 14px);
  pointer-events:none;
}
.sm{color:#aab5c3;font-size:12px;line-height:1.55}
.row{gap:10px;align-items:center}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
button{
  position:relative;overflow:hidden;
  font:700 12px/1.25 "Segoe UI",Arial,sans-serif;
  color:#eef2f6;background:linear-gradient(#283443,#1b2430);
  border:1px solid #4a5868;border-radius:4px;
  padding:9px 13px;min-height:36px;
  text-transform:uppercase;letter-spacing:.035em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 4px rgba(0,0,0,.16);
  transition:transform .14s ease,border-color .14s ease,filter .14s ease;
}
button:hover:not(:disabled){filter:brightness(1.18);border-color:#8392a3;transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:focus-visible{outline:2px solid #ff544b;outline-offset:2px}
button:disabled{opacity:.32;filter:grayscale(.65);cursor:not-allowed}
button.on,button.big{
  color:#fff;background:linear-gradient(135deg,#ff3027,#c90000);
  border-color:#ff4c43;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 14px rgba(225,6,0,.18);
}
button.big{font-size:13px;padding:12px 19px;min-height:42px}
.wrap{overflow-x:auto;border:1px solid #303b49;border-radius:5px;background:#111720}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #2b3542;white-space:nowrap}
th{
  position:sticky;top:0;z-index:1;
  background:linear-gradient(#303c4b,#222d3a);
  color:#dce3eb;font-size:10px;font-weight:850;
  text-transform:uppercase;letter-spacing:.09em;
  border-bottom:1px solid #4b5969;
}
td{color:#e3e8ee}
tbody tr:nth-child(even) td,tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.055)}
tr.me td{background:rgba(225,6,0,.16)!important;color:#fff;border-bottom-color:rgba(225,6,0,.23)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;box-shadow:0 0 0 2px rgba(255,255,255,.08);vertical-align:middle}
.pos{color:#47e0a8;font-weight:800}.neg{color:#ff626b;font-weight:800}
input,select,textarea{font:inherit;color:var(--fg);background:#0e141c;border:1px solid #455365;border-radius:4px;padding:9px 10px;max-width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid rgba(225,6,0,.65);outline-offset:1px}
::selection{background:#e10600;color:white}
@media(max-width:700px){
  #app{padding:18px 10px 32px}
  #app:before{font-size:9px;letter-spacing:.14em}
  .grid{grid-template-columns:1fr}
  .card{padding:13px;margin:11px 0}
  th,td{padding:8px 9px}
  h1{font-size:26px}
  button{padding:9px 10px}
}
@media(prefers-reduced-motion:reduce){button{transition:none}}

</style>

<style id="mini-manager-f1-cinematic-layer">
/* DIRECTOR DE BOXES — CINEMATIC MOTORSPORT LAYER
   Visual-only additions. Game logic and event handlers remain untouched. */
:root{
  --acc:#f32620;
  --bg:#080c12;
  --fg:#f4f6f8;
  --card:#141c26;
  --mut:#a4b0bf;
  --bd:#354353;
  --ok:#39e0a0;
  --bad:#ff5964;
  --hl:#f6c744;
}
html{background:#070a0e}
body{
  background:
    radial-gradient(ellipse at 50% -20%,rgba(255,47,37,.23),transparent 36rem),
    radial-gradient(ellipse at 100% 48%,rgba(21,104,157,.15),transparent 35rem),
    linear-gradient(135deg,#111b27 0%,#070a0f 53%,#111722 100%);
  background-attachment:fixed;
}
#app{max-width:1380px;padding:clamp(14px,2.8vw,38px) clamp(12px,3vw,42px) 56px}
#app:before{
  content:"DB  /  MOTORSPORT MANAGEMENT SYSTEM  /  SEASON CONTROL";
  letter-spacing:.19em;color:#c3cbd4;border-color:#2d3948;
  padding:0 0 12px 2px;margin-bottom:20px;
}
#app:after{
  height:5px;
  background:linear-gradient(90deg,#f32620 0 15%,#f7f8fa 15% 15.35%,#f32620 15.35% 19%,#263344 19% 100%);
  box-shadow:0 0 22px rgba(243,38,32,.35);
}
h1{font-size:clamp(28px,4vw,48px);letter-spacing:-.055em;text-shadow:0 5px 28px rgba(243,38,32,.25)}
h1:after{height:34px;min-width:48px;font-size:16px;box-shadow:0 5px 18px #f3262033}
h2{font-size:13px;letter-spacing:.12em;color:#f6f8fb;border-bottom-color:#394757;padding-bottom:12px}
h2:before{width:5px;background:linear-gradient(#ff5a50,#c40000);box-shadow:0 0 12px #f3262040}
.card{
  border:1px solid #344253;border-radius:7px;
  background:linear-gradient(145deg,rgba(27,38,52,.97),rgba(14,20,29,.99) 72%);
  box-shadow:0 14px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.055);
  padding:clamp(15px,2vw,25px);margin:16px 0;
}
.card:after{opacity:.08;right:-24px;top:-35px;width:155px;height:155px}
/* Opening screen: a race-control hero without changing the HTML or game flow. */
#app > .row:first-of-type{position:relative;align-items:center;min-height:112px;padding:8px 0 15px}
#app > .row:first-of-type:after{
  content:"";position:absolute;z-index:-1;right:0;top:0;bottom:0;width:58%;opacity:.8;
  background:
    linear-gradient(105deg,transparent 0 12%,rgba(243,38,32,.10) 12% 12.5%,transparent 12.5% 22%,rgba(255,255,255,.055) 22% 22.5%,transparent 22.5%),
    repeating-linear-gradient(135deg,transparent 0 18px,rgba(255,255,255,.025) 18px 20px,transparent 20px 38px);
  clip-path:polygon(15% 0,100% 0,100% 100%,0 100%);
  pointer-events:none;
}
/* The first panel reads like a game-mode selection / team garage screen. */
#app > .card:first-of-type{
  border-color:#46576b;
  background:
    radial-gradient(ellipse at 92% 0%,rgba(243,38,32,.18),transparent 33%),
    linear-gradient(115deg,rgba(31,45,61,.99),rgba(13,19,28,.99) 68%);
}
#app > .card:first-of-type h2{font-size:14px}
button{
  border-radius:3px;border-color:#536276;
  background:linear-gradient(180deg,#344457 0%,#202b39 52%,#18212c 100%);
  color:#f4f6f8;letter-spacing:.055em;
  box-shadow:inset 0 1px rgba(255,255,255,.10),0 4px 9px rgba(0,0,0,.22);
}
button:hover:not(:disabled){border-color:#f7a09c;box-shadow:inset 0 1px rgba(255,255,255,.12),0 0 0 1px #f3262033,0 6px 14px #0005}
button.on,button.big{
  background:linear-gradient(180deg,#ff443b 0%,#e10600 55%,#b90000 100%);
  border-color:#ff625a;color:#fff;
  box-shadow:inset 0 1px rgba(255,255,255,.24),0 5px 18px rgba(225,6,0,.24);
}
button.big{padding:13px 20px;min-height:46px;font-size:13px}
.wrap{border:1px solid #394859;border-radius:4px;background:#0b1119;box-shadow:inset 0 1px 7px #0005}
table{font-size:12px}
th{background:linear-gradient(180deg,#3b4c60,#263344);color:#f2f5f8;border-bottom-color:#5b6c80;letter-spacing:.11em}
th,td{padding:11px 12px}
td{color:#e8edf3}
tr:nth-child(even) td{background:rgba(255,255,255,.035)}
tr:hover td{background:rgba(255,255,255,.075)}
tr.me td{background:linear-gradient(90deg,rgba(243,38,32,.27),rgba(243,38,32,.10))!important;border-bottom-color:#8e3335}
.dot{width:10px;height:10px;border-radius:1px;box-shadow:0 0 0 1px #fff5,0 0 10px currentColor}
input,select,textarea{background:#0b1119;border-color:#43546a;color:#f4f6f8}
.pos{color:#50f0b0}.neg{color:#ff6972}
.sm{color:#aab7c6}
/* Compact race-control strips and clearer emphasis for key values. */
b{color:#f6f8fb}
.card b{font-weight:800}
.card .row{row-gap:9px}
@media(min-width:900px){
  #app > .grid{gap:16px}
  #app > .card:first-of-type .wrap{margin-top:16px}
}
@media(max-width:700px){
  #app{padding:16px 10px 30px}
  #app:before{font-size:8px;letter-spacing:.1em;line-height:1.6}
  #app > .row:first-of-type{min-height:84px}
  #app > .row:first-of-type:after{width:48%;opacity:.45}
  h1{font-size:26px;gap:7px}
  h1:after{height:26px;min-width:38px;font-size:12px}
  .card{padding:14px;margin:11px 0}
  th,td{padding:8px 9px}
  button{letter-spacing:.025em}
}
@media(prefers-reduced-motion:no-preference){
  button{transition:transform .16s ease,border-color .16s ease,filter .16s ease,box-shadow .16s ease}
  .card{animation:garageIn .28s ease both}
  @keyframes garageIn{from{opacity:.82;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style>

.mm-hero{
 position:relative; isolation:isolate; overflow:hidden; min-height:clamp(260px,32vw,430px);
 display:flex; align-items:flex-end; margin:10px 0 20px; padding:clamp(22px,4vw,52px);
 border:1px solid #50657a; border-radius:7px;
 background-image:linear-gradient(90deg,rgba(5,10,16,.06) 0%,rgba(5,10,16,.18) 38%,rgba(5,10,16,.88) 67%,#080d14 100%),
  linear-gradient(0deg,rgba(4,8,13,.88),transparent 58%),var(--hero-img);
  background-size:cover; background-position:center 53%; background-repeat:no-repeat;
 box-shadow:0 22px 55px #0008,inset 0 1px #ffffff22;
}
.mm-hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 0 57%,rgba(225,6,0,.16) 57.2% 57.6%,transparent 57.8%);pointer-events:none}
.mm-hero-copy{width:min(520px,48%);margin-left:auto;text-align:left;text-shadow:0 2px 14px #000}
.mm-kicker{font-size:11px;letter-spacing:.23em;text-transform:uppercase;font-weight:900;color:#ff625a;margin-bottom:10px}
.mm-hero h2{font-size:clamp(25px,4vw,49px);line-height:1.01;letter-spacing:-.04em;margin:0 0 13px;padding:0;border:0;font-weight:950;text-transform:uppercase}
.mm-hero h2:before{display:none}
.mm-hero h2 em{display:block;color:#ff3028;font-style:normal}
.mm-hero p{font-size:clamp(13px,1.5vw,17px);line-height:1.55;color:#e1e7ee;margin:0;max-width:440px}
.mm-hero-tag{display:inline-flex;align-items:center;gap:8px;margin-top:19px;padding:8px 12px;border:1px solid #ffffff45;background:#080e16bd;color:#f5f7fa;font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}
.mm-hero-tag:before{content:"";width:8px;height:8px;background:#ff3028;box-shadow:0 0 12px #ff3028;border-radius:50%}
.mm-start-card{border-top:3px solid #f32620!important}
.mm-start-card h2{font-size:15px!important}
.mm-team-table tr td:last-child{width:1%;}

function leaveGame(k){askLeave=false;if(G.np<2||k<0||k>=G.np)return;
  const ti=G.hum[k],nm=G.names[k],ph=G.phase,cur=G.cur;saveP();
  if(G.q)G.q.ents.forEach(e=>{if(e.ti==ti)e.mine=false});if(G.live)G.live.ent.forEach(e=>{if(e.ti==ti)e.mine=false});
  G.f2.forEach(d=>{if(d.ow==k+1){d.ow=0;d.own=false}else if(d.ow>k+1)d.ow--});
  G.P.splice(k,1);G.hum.splice(k,1);G.names.splice(k,1);G.np--;
  G.P.forEach(p=>p.note=nm+' abandonó la partida: su escudería pasa a la computadora. '+(p.note||''));
  const turn=TURNPH.includes(ph)&&cur==k;let nxt=k;if(turn){if(ph=='quali')while(nxt<G.np&&!qAlive(nxt))nxt++;else if(ph=='race')while(nxt<G.np&&!rAlive(nxt))nxt++}
  const wasLast=turn&&nxt>=G.np;
  loadP(turn?(wasLast?G.np-1:nxt):(cur>k?cur-1:Math.min(cur,G.np-1)));
  if(turn&&!wasLast)G.hold=G.np>1;else G.hold=false;
  if(wasLast){if(ph=='main'){startQuali();return}if(ph=='grid'){startRace();return}if(ph=='market'){closeMarket();return}if(ph=='quali'){runSeg();return}if(ph=='race'){contRace();return}}
  save();render()}

// ---------- COLABORACIÓN ENTRE COMPAÑEROS ----------
// Cada piloto tiene un perfil de colaboración de 0 (muy individualista) a 100 (muy colaborador). La escudería elige una política de equipo
// (se puede cambiar antes de largar y en cada pausa de la carrera):
//  0 Libre competencia: los individualistas rinden más (rivalidad), pero hay riesgo de toque entre compañeros (más si están cerca, son individualistas y arriesgan).
//  1 Colaboración total: sin toques; ambos ganan ritmo por rebufo y datos compartidos (más si los dos son colaboradores) y baja el azar; el que va adelante cede algo si es individualista.
//  2/3 Prioridad a un piloto: el elegido gana ritmo y el otro hace de escudero (pierde ritmo, más si es individualista). Si el escudero va delante, la escudería le ordena ceder: los colaboradores obedecen, los individualistas pueden ignorarla.
const TPN=['Libre competencia','Colaboración total','Prioridad al piloto 1','Prioridad al piloto 2'];
const TPD=['Los dos corren sin órdenes. Los individualistas rinden más, pero hay riesgo de toque entre compañeros.','Los dos trabajan juntos: rebufo, datos compartidos y menos azar. Sin riesgo de toque.','El piloto 1 es la prioridad. El piloto 2 le ayuda y, si va delante, tiene que dejarlo pasar.','El piloto 2 es la prioridad. El piloto 1 le ayuda y, si va delante, tiene que dejarlo pasar.'];
function coOf(d){if(d.co==null){let h=2166136261;const s=d.n+'#co';for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}h=(h^(h>>>13))>>>0;d.co=10+h%81}return d.co}
const coLabel=c=>c<25?'Muy individualista':c<45?'Individualista':c<=55?'Equilibrado':c<=75?'Colaborador':'Muy colaborador';
const tpPol=ti=>{const L=G.live;return L&&L.tp&&L.tp[ti]!=null?L.tp[ti]:0};
function aiPol(t){const av=(coOf(t.dr[0])+coOf(t.dr[1]))/200,r=Math.random();if(Math.abs(t.dr[0].s-t.dr[1].s)>=6&&r<.35)return t.dr[0].s>t.dr[1].s?2:3;return r<.2+.6*av?1:0}
function tpAdj(x){const L=G.live,y=L.ent.find(z=>z.ti==x.ti&&z!==x);if(!y||y.dnf)return{p:0,s:1};
  const co=coOf(G.teams[x.ti].dr[x.di])/100,ind=1-co,cy=coOf(G.teams[y.ti].dr[y.di])/100,pol=tpPol(x.ti);
  if(pol==0)return{p:(ind-.5)*1.4,s:1};
  if(pol==1)return{p:.15+.9*co*cy-(x.sum>=y.sum?.8*ind:0),s:1-.12*(co+cy)/2};
  if(x.di==pol-2)return{p:1.6+.7*cy,s:1-.05*cy};
  return{p:-(1+1.4*ind),s:1}}
function teamDuel(){const L=G.live,nm=x=>G.teams[x.ti].dr[x.di].n;
  G.teams.forEach((t,ti)=>{const a=L.ent.find(x=>x.ti==ti&&x.di==0),b=L.ent.find(x=>x.ti==ti&&x.di==1);if(!a||!b||a.dnf||b.dnf)return;
    const pol=tpPol(ti),ia=1-coOf(t.dr[0])/100,ib=1-coOf(t.dr[1])/100,gap=Math.abs(a.sum-b.sum),lap=(L.sec+1)*10;
    if(pol>=2){const P=pol==2?a:b,S=pol==2?b:a,cS=coOf(t.dr[S.di])/100;
      if(S.sum>P.sum&&S.sum-P.sum<6){
        if(Math.random()<.25+.7*cS){const tmp=P.sum;P.sum=S.sum;S.sum=tmp-.8;L.log.push('Vuelta '+lap+': 🤝 orden de equipo en '+t.n+': '+nm(S)+' cede la posición a '+nm(P)+'.')}
        else{L.log.push('Vuelta '+lap+': 🙅 '+nm(S)+' ignora la orden de '+t.n+' y no deja pasar a '+nm(P)+'.');if(Math.random()<.12){P.sum-=3;S.sum-=3;L.log.push('Vuelta '+lap+': 💥 roce entre compañeros de '+t.n+' por la orden ignorada: los dos pierden tiempo.')}}}
      return}
    if(pol!=0)return;
    const cl=gap<2?1:gap<5?.6:gap<9?.25:0,pr=clp(.05*(ia+ib)*cl*(1+.4*(a.st==2)+.4*(b.st==2)),0,.15);
    if(Math.random()>=pr)return;
    const ag=ia>ib||(ia==ib&&Math.random()<.5)?a:b,vi=ag===a?b:a,r=Math.random();
    if(r<.35){a.sum-=4+Math.random()*4;b.sum-=4+Math.random()*4;L.log.push('Vuelta '+lap+': ⚔️ toque entre compañeros de '+t.n+': '+nm(a)+' y '+nm(b)+' pierden tiempo.')}
    else if(r<.7){vi.sum-=10;ag.sum-=3;L.log.push('Vuelta '+lap+': ⚔️ '+nm(ag)+' (individualista) fuerza un adelantamiento sobre su compañero '+nm(vi)+' y lo saca de la trazada ('+t.n+').')}
    else{vi.dnf=L.sec+1;vi.dlap=lap;ag.sum-=6;L.log.push('Vuelta '+lap+': 💥 choque entre compañeros de '+t.n+': abandona '+nm(vi)+' y '+nm(ag)+' pierde tiempo.')}})}
function setTp(v){G.tp=v;save();render()}
function setLTp(v){if(G.live){G.live.tp=G.live.tp||{};G.live.tp[G.me]=v}G.tp=v;save();render()}
function tpCard(live){const t=G.teams[G.me],v=live?tpPol(G.me):G.tp,d0=t.dr[0],d1=t.dr[1],c0=coOf(d0),c1=coOf(d1),av=1-(c0+c1)/200;
  const risk=av<.35?'bajo':av<.6?'medio':'alto',fn=live?'setLTp':'setTp';let adv='';
  if(v==0)adv='Riesgo de toque entre tus pilotos: <b class="'+(risk=='alto'?'neg':risk=='bajo'?'pos':'')+'">'+risk+'</b>.';
  else if(v==1)adv='Aprovechamiento de la colaboración: <b>'+(c0*c1>=3600?'alto':c0*c1>=1800?'medio':'bajo')+'</b> (depende de que ambos sean colaboradores).';
  else{const S=t.dr[v==2?1:0],cS=coOf(S);adv=cS<45?'<b class="neg">'+S.n+' es individualista: rinde mucho menos de escudero y puede ignorar la orden.</b>':cS>55?'<b class="pos">'+S.n+' es colaborador: acepta bien el rol de escudero.</b>':S.n+' es equilibrado: acepta el rol con algo de resistencia.'}
  return '<div class="card"><h2>🤝 Política de equipo</h2><div class="sm">'+[d0,d1].map(d=>d.n+': <b>'+coLabel(coOf(d))+'</b> ('+coOf(d)+')').join(' · ')+'</div><div class="row" style="margin-top:6px">'+[0,1,2,3].map(q=>btnF(v==q,fn+'('+q+')',TPN[q])).join('')+'</div><div class="sm">'+TPD[v]+'</div><div class="sm">'+adv+'</div></div>'}

function applyEd(txt){let o;try{o=JSON.parse(txt)}catch(e){edMsg('El texto no es un JSON válido.',0);return}
  const eq=o&&o.equipos;if(!Array.isArray(eq)){edMsg('Formato no reconocido: falta la lista "equipos".',0);return}
  let nt=0,nd=0;
  eq.slice(0,G.teams.length).forEach((e,ti)=>{if(!e)return;const t=G.teams[ti],nm=clean(e.nombre||'').slice(0,24);if(nm){t.n=nm;nt++}
    (e.pilotos||[]).slice(0,2).forEach((p,di)=>{const d=t.dr[di];if(!d||!p)return;const pn=clean(p.nombre||'').slice(0,24);if(pn)d.n=pn;
      let v=parseInt(p.edad);if(!isNaN(v))d.age=clp(v,16,50);
      const f=typeof p.estilo=='string'?STY.findIndex(x=>x.toLowerCase()==p.estilo.toLowerCase()):parseInt(p.estilo);if(f>=0&&f<=2)d.fs=f;
      v=parseInt(p.nivel);if(!isNaN(v)){d.s=clp(v,40,99);d.pot=Math.max(d.pot||0,d.s);d.w=wage(d.s,d.ct||1,6)}
      v=parseInt(p.colaboracion);if(!isNaN(v))d.co=clp(v,0,100);nd++})});
  let nc=0;if(Array.isArray(o.calendario)){G.cn=G.cn||[];const seen=new Set();o.calendario.slice(0,CIRC.length).forEach((e,i)=>{if(!e)return;const g=clean(e.gp||'').slice(0,32),ci=clean(e.circuito||'').slice(0,32),n=G.cn[i]=G.cn[i]||{};if(g&&!seen.has(g.toLowerCase())){n.gp=g;seen.add(g.toLowerCase());nc++}if(ci)n.ci=ci});applyCirc();const sn=new Set();CIRC.forEach((c,i)=>{if(sn.has(c[0].toLowerCase())){G.cn[i]=G.cn[i]||{};G.cn[i].gp=c[0]+' ('+(i+1)+')'}sn.add(c[0].toLowerCase())});applyCirc()}
  save();render();edMsg('Importado: '+nt+' escuderías, '+nd+' pilotos y '+nc+' GP.',1)}

  G.rk=ranking();
  const f2s=G.f2.slice().sort((a,b)=>b.pts-a.pts||b.s-a.s);f2s.forEach((d,i)=>{d.rank=i+1});
  G.f2.forEach(d=>{d.age++;d.s=Math.min(d.pot,d.s+R(1,4)+(d.own||d.ow?1:0)+(d.rank==1?1:0));d.lic=d.s>=68||d.rank<=3});
  G.fa=G.fa.filter(d=>{dev1(d);return d.age<37&&d.s>=55});
  G.P.forEach(p=>p.note='');G.note='';G.P.forEach((p,k)=>ageSpon(k));
  G.teams.forEach((t,ti)=>{for(let i=t.dr.length-1;i>=0;i--){const d=t.dr[i];dev1(d);d.ct--;
    if(d.age>=39){t.dr.splice(i,1);if(isH(ti)){const p=G.P[hk(ti)];p.note=(p.note||'')+d.n+' se retiró. '}continue}
    if(!isH(ti)&&d.ct<=0){if(Math.random()<.6){d.ct=R(1,3);d.w=wage(d.s,d.ct,G.rk.indexOf(ti)+1)}else{t.dr.splice(i,1);G.fa.push({n:d.n,s:d.s,age:d.age,pot:d.pot})}}}});
  G.phase='market';loadP(0);G.hold=G.np>1;save();render()}
function renew(i,dur){const d=G.teams[G.me].dr[i];if(!d)return;d.ct=dur;d.w=wage(d.s,dur,myRank());G.note='Renovaste a '+d.n+' por '+dur+' temporada(s) a '+f2d(d.w)+' M por carrera.';save();render()}
function letGo(i){const d=G.teams[G.me].dr.splice(i,1)[0];if(d){G.fa.push({n:d.n,s:d.s,age:d.age,pot:d.pot});G.note=d.n+' queda libre, sin indemnización.';save();render()}}
function buyout(i){const t=G.teams[G.me],d=t.dr[i],cost=d.w*CIRC.length*d.ct*.4;if(G.bud<cost){G.note='No alcanza el presupuesto para rescindir a '+d.n+' ('+f1(cost)+' M).';render();return}
  G.bud-=cost;t.dr.splice(i,1);G.fa.push({n:d.n,s:d.s,age:d.age,pot:d.pot});G.note='Rescindiste a '+d.n+': indemnización de '+f1(cost)+' M.';save();render()}
function signFa(i,dur){const t=G.teams[G.me];if(t.dr.length>=2){G.note='No tenés un asiento libre: dejá ir o rescindí a un piloto primero.';render();return}
  const d=G.fa.splice(i,1)[0];t.dr.push({n:d.n,s:d.s,age:d.age,pot:d.pot,pts:0,ct:dur,w:wage(d.s,dur,myRank())});G.note='Fichaste a '+d.n+' por '+dur+' temporada(s).';save();render()}
function signGrad(i,dur){const t=G.teams[G.me];if(t.dr.length>=2){G.note='No tenés un asiento libre: dejá ir o rescindí a un piloto primero.';render();return}
  const d=G.f2.splice(i,1)[0];t.dr.push({n:d.n,s:d.s,age:d.age,pot:d.pot,pts:0,ct:dur,w:wage(d.s,dur,myRank())});G.note='Fichaste al graduado de Promesas '+d.n+' por '+dur+' temporada(s).';save();render()}
function promote(i){const t=G.teams[G.me];if(t.dr.length>=2){G.note='No tenés un asiento libre: dejá ir o rescindí a un piloto primero.';render();return}
  const d=G.f2.splice(i,1)[0];t.dr.push({n:d.n,s:d.s,age:d.age,pot:d.pot,pts:0,ct:2,w:wage(d.s,2,myRank())*.8});G.note='Promoviste a '+d.n+' desde la academia: contrato de 2 temporadas con descuento.';save();render()}
function closeMarket(){
  const t=G.teams[G.me];if(t.dr.length<2){G.note='Necesitás dos pilotos para largar la temporada.';render();return}
  if(G.np>1&&G.cur<G.np-1){passTo(G.cur+1);return}saveP();
  const cand=()=>G.fa.map(d=>({d,src:'fa'})).concat(G.f2.filter(d=>d.lic&&!d.own&&!d.ow).map(d=>({d,src:'f2'})));
  G.rk.forEach(ti=>{if(isH(ti))return;const tt=G.teams[ti];
    while(tt.dr.length<2){const c=cand().sort((a,b)=>(b.d.s+.3*b.d.pot)-(a.d.s+.3*a.d.pot)).slice(0,3);let d;
      if(c.length){const x=pk(c);d=x.d;if(x.src=='fa')G.fa.splice(G.fa.indexOf(d),1);else G.f2.splice(G.f2.indexOf(d),1)}else{d=mkRookie();d.s=R(60,68);d.pot=d.s+3}
      const ct=R(1,3);tt.dr.push({n:d.n,s:d.s,age:d.age,pot:d.pot,pts:0,ct,w:wage(d.s,ct,G.rk.indexOf(ti)+1)})}});
  G.fa=G.fa.filter(d=>Math.random()<.7);
  G.f2=G.f2.filter(d=>d.age<26);while(G.f2.length<24)G.f2.push(mkRookie());G.f2.forEach(d=>{d.pts=0;d.rank=0});
  G.note='';newSeason()}
function nextRace(){G.wx=genWx();G.q=null;G.grid=null;G.phase='main';loadP(0);G.hold=G.np>1;save();render()}
function newSeason(){G.s++;G.race=0;G.prize=0;G.last=null;G.wx=genWx();G.q=null;G.grid=null;G.phase='main';
  G.teams.forEach((t,i)=>{t.pts=0;t.dr.forEach(d=>d.pts=0);if(!isH(i))for(let k=0;k<3;k++)if(G.tech.par[k]!==i)t.car[k]=Math.max(50,Math.min(capOf(i,k),t.car[k]+Math.round(gauss())))});
  loadP(0);G.hold=G.np>1;save();render()}
function reset(){if(!resetArm){resetArm=true;render();return}resetArm=false;G=fresh();ensure();save();render()}

const dot=c=>'<span class="dot" style="background:'+c+'"></span>';
function tblTeams(){const r=ranking();
  return '<div class="card"><h2>Constructores</h2><div class="wrap"><table><tr><th>#</th><th>Escudería</th><th>Pts</th></tr>'+r.map((i,k)=>'<tr'+(isH(i)?' class=\"me\"':'')+'><td>'+(k+1)+'</td><td>'+dot(G.teams[i].c)+G.teams[i].n+'</td><td><b>'+G.teams[i].pts+'</b></td></tr>').join('')+'</table></div></div>'}
function tblDrivers(){const a=[];G.teams.forEach((t,ti)=>t.dr.forEach(d=>a.push({ti,d})));a.sort((x,y)=>y.d.pts-x.d.pts||y.d.s-x.d.s);
  return '<div class="card"><h2>Pilotos</h2><div class="wrap"><table><tr><th>#</th><th>Piloto</th><th>Escudería</th><th>Pts</th></tr>'+a.slice(0,12).map((x,k)=>'<tr'+(isH(x.ti)?' class=\"me\"':'')+'><td>'+(k+1)+'</td><td>'+x.d.n+'</td><td>'+dot(G.teams[x.ti].c)+G.teams[x.ti].n+'</td><td><b>'+x.d.pts+'</b></td></tr>').join('')+'</table></div></div>'}
function head(){const sh=shared(),t=(G.me!=null&&!sh)?G.teams[G.me]:null;
  return '<div class="row" style="justify-content:space-between"><div><h1>🏎️ Director de Boxes</h1>'+(t?'<div class="sm">'+(G.np>1?G.names[G.cur]+' · ':'')+dot(t.c)+t.n+' · Temporada '+G.s+'</div>':(sh?'<div class="sm">Modo multijugador · Temporada '+G.s+'</div>':''))+'</div>'+(t?'<div style="text-align:right"><div class="sm">Presupuesto</div><b style="font-size:20px" class="'+(G.bud<0?'neg':'')+'">$'+f1(G.bud)+' M</b><div class="sm">🔒 '+f1(fin().blk)+' M bloqueado · 🔓 <b>'+f1(Math.max(0,fin().free))+' M</b> disponible</div></div>':'')+'</div>'}
const edBtn=()=>'<div class="card"><h2>✏️ Editor</h2><div class="sm">Editá nombres de escuderías y pilotos, edades, estilos, niveles y perfil de colaboración antes de empezar.</div><div class="row" style="margin-top:8px"><button onclick="openEd()">Abrir editor de escuderías y pilotos</button></div></div>';
function vStart(){const stN='<p class="sm" style="text-align:center;opacity:.75;margin:10px 0">📊 Este juego registra estadísticas anónimas de uso (tiempo de juego, secciones visitadas y errores) para poder mejorarlo. No se guarda ningún dato personal.</p>';if(!G.np)return vPlayers()+edBtn()+stN;return vStart0()+edBtn()+stN}

  G.teams.map((t,i)=>'<tr><td>'+dot(t.c)+'<b>'+t.n+'</b></td><td>'+t.car[0]+'</td><td>'+t.car[1]+'</td><td>'+t.car[2]+'</td><td>'+t.dr.map(d=>d.n+' ('+d.s+')').join(', ')+'</td><td>'+(isH(i)?'<span class="sm">Elegida por '+G.names[hk(i)]+'</span>':'<button onclick="pick('+i+')">Elegir escudería</button>')+'</td></tr>').join('')+'</table></div></div>'}
function btnF(on,fn,l,dis){return '<button class="'+(on?'on':'')+'" '+(dis?'disabled':'')+' onclick="'+fn+'">'+l+'</button>'}
function techNews(ev){return (ev||[]).map(e=>{const x=G.teams[e.ti],mine=isH(e.ti);
  return '<div class="card" style="border-color:'+(mine?'var(--acc)':'rgba(255,255,255,.25)')+'"><h2>🔬 ¡Revolución tecnológica en '+COMP[e.k].toLowerCase()+'!</h2><div class="sm">'+dot(x.c)+'<b>'+x.n+'</b> descubrió <b>'+e.name+'</b> (era '+e.era+') y '+(mine?'<b class="pos">tu escudería pasa a ser el nuevo paradigma</b>':'pasa a ser el nuevo paradigma')+': su '+COMP[e.k].toLowerCase()+' sube a <b>'+CAPP+'</b>. El resto del pelotón queda desactualizado y baja <b>'+e.D+' puntos</b> en ese componente mientras se adapta. Los equipos que investigaban esa área pierden parte de su avance.</div></div>'}).join('')}
function vTech(t){const T=G.tech,idx=G.teams.map((x,i)=>i);
  const rows=COMP.map((n,k)=>{const pr=T.par[k],p=rdChance(t,k),yr=1-Math.pow(1-p,CIRC.length),full=t.rd[k]>=RD_MAX;
    return '<div style="margin:8px 0;padding:8px 10px;border:1px solid rgba(255,255,255,.14);border-radius:10px"><div><b>'+n+'</b> · Era '+T.era[k]+': <span class="sm">'+techName(k,T.era[k])+'</span></div>'+
    '<div class="sm">Referente: '+(pr<0?'ninguno todavía (tecnología base)':dot(G.teams[pr].c)+'<b>'+G.teams[pr].n+'</b> ('+CAPP+')')+' · Tu I+D: <b>'+t.rd[k]+'</b> pts · Chance de descubrimiento: <b>'+(p*100).toFixed(1)+'%</b> por carrera (~'+Math.round(yr*100)+'% por temporada)</div>'+
    '<div class="row" style="margin-top:6px">'+btnF(false,'rdInvest('+k+',2)','Invertir $2 M',!canSp(2)||full)+btnF(false,'rdInvest('+k+',5)','Invertir $5 M',!canSp(5)||full)+(full?'<span class="sm">Equipo de investigación al máximo.</span>':'')+'</div></div>'}).join('');
  const hist=T.hist.slice(0,3).map(e=>'<div class="sm">T'+e.s+' · carrera '+e.race+': '+dot(G.teams[e.ti].c)+G.teams[e.ti].n+' → '+e.name+' ('+COMP[e.k]+')</div>').join('');
  const tab='<details style="margin-top:6px"><summary class="sm" style="cursor:pointer">Mapa tecnológico del pelotón</summary><div class="wrap"><table><tr><th>Escudería</th>'+COMP.map(n=>'<th>'+n+'</th>').join('')+'</tr>'+
    idx.slice().sort((a,b)=>carR(G.teams[b],'m')-carR(G.teams[a],'m')).map(i=>{const x=G.teams[i];return '<tr'+(isH(i)?' class="me"':'')+'><td>'+dot(x.c)+x.n+'</td>'+[0,1,2].map(k=>'<td>'+x.car[k]+(T.par[k]===i?' ★':'')+'</td>').join('')+'</tr>'}).join('')+'</table></div></details>';
  return '<div class="card"><h2>🔬 Investigación y desarrollo (I+D)</h2><div class="sm">Invertir en I+D no mejora el auto de inmediato: acumula puntos de investigación que aumentan la chance de descubrir una <b>tecnología nueva</b> en ese componente. Quien la descubre sube a <b>'+CAPP+'</b> y se vuelve el paradigma (★); todos los demás bajan unos 7 a 10 puntos para adaptarse y luego pueden volver a desarrollar hasta '+CAPN+'. Las computadoras también investigan, y más cuando la tecnología vigente está agotada. Si otro descubre antes que vos, perdés parte de tu avance en esa área.</div>'+rows+hintFin()+
    (hist?'<div class="sm" style="margin-top:6px"><b>Últimos descubrimientos</b></div>'+hist:'')+tab+'</div>'}
function vWeek(){
  const t=G.teams[G.me],c=CIRC[G.race],k=CK[c[1]],btn=btnF;
  const su=[0,1,2].map(i=>{const g=carE(t,c[1],i)-carR(t,c[1]);return btn(G.setup==i,'setSetup('+i+')',COMP[i]+' ('+(g>=0?'+':'')+f1(g)+')')}).join('');
  const up=COMP.map((n,i)=>{const cost=upCost(t,i),mx=t.car[i]>=capOf(G.me,i);return btn(false,'upgrade('+i+')',mx?n+' '+t.car[i]+' · máximo':n+' '+t.car[i]+' → '+(t.car[i]+1)+' · $'+f1(cost)+' M',!canSp(cost)||mx)}).join('');

  '<div class="card"><h2>Carrera '+(G.race+1)+' de '+CIRC.length+': '+c[0]+'</h2><div class="sm">🏟️ <b>'+c[2]+'</b><br>'+k[0]+'.'+(CR[c[0]]&&CR[c[0]].d?'<br>'+CR[c[0]].d+'.':'')+'<br>🚨 Riesgo de safety car del circuito: <b>'+scRisk(c[0])+'</b> (sube con la lluvia, el desgaste de las gomas y la cantidad de pilotos que arriesgan).<br>🌦 Probabilidad de lluvia este fin de semana: <b>'+Math.round(G.wx.pr*100)+'%</b>. Con lluvia pesa más el piloto y hay más azar; con neumáticos de seco bajo la lluvia se pierde muchísimo ritmo.</div></div>'+
  '<div class="card"><h2>Puesta a punto</h2><div class="row">'+su+'</div><div class="sm" style="margin-top:6px">'+SUD[G.setup]+' El número entre paréntesis es la ganancia de ritmo del auto en este circuito, según tus componentes. Vale para la clasificación y la carrera.</div></div>'+
  '<div class="card"><h2>Desarrollo del auto</h2><div class="row">'+up+'</div><div class="sm" style="margin-top:6px">Cada mejora suma +1 al componente y cuesta más cuanto más alto está. Auto en este circuito con tu puesta a punto: <b>'+f1(carE(t,c[1],G.setup))+'</b>. El desarrollo convencional tiene un techo de '+CAPN+': para superarlo hace falta una tecnología nueva (ver I+D).</div>'+hintFin()+'</div>'+vTech(t)+

  const Q=G.q,wet=G.wx.q,seg=Q.seg,names=['Q1','Q2','Q3'],btn=btnF,mineAlive=Q.ents.filter(e=>e.mine&&!e.pos&&(G.np==1||e.ti==G.me));let tbl='';

// Ingreso por carrera = derechos de TV/Federación (TVB, siempre) + sueldo fijo de cada sponsor + bono por punto de cada sponsor. Al cierre de la temporada
// cada sponsor con objetivo paga su bono si la escudería terminó en el puesto pedido. El sponsor principal puede exigir cambiar el color del auto.
// PRESUPUESTO BLOQUEADO (como el "pago mínimo" de una tarjeta): lo que falta pagar de gastos fijos hasta fin de temporada (sueldos, gastos, academia) + las cuotas
// de préstamos de esa ventana, menos los ingresos GARANTIZADOS (TV + fijos de sponsors; los bonos no se cuentan). Ese monto no se puede gastar en desarrollo ni I+D.

function calc(o){const t=o.t,m=SPM[t.mode],ob=SPO[t.obj],base=SPV[o.sl]*o.k*o.tf;
  return{f:base*m[1]*ob[1]*SPD[t.dur-1]*(t.color?1+SPCOL:1)*(1+o.bump),b:SPB[o.sl]*o.k*o.tf*m[2]*(1+o.bump),ob:t.obj?base*CIRC.length*ob[2]:0,tg:t.obj?clp(o.r0+SPOR[t.obj],1,11):0}}
const rr=()=>{const y=window.scrollY;save();render();window.scrollTo(0,y)};
function spSet(sl,i,k,v){const o=G.offers[sl][i];if(!o)return;if(k=='dur'&&o.t.color&&v<2)return;o.t[k]=v;if(k=='color'&&v&&o.t.dur<2)o.t.dur=2;rr()}
function spHag(sl,i){const o=G.offers[sl][i];if(!o||o.tried)return;o.tried=true;
  if(Math.random()<HAG){o.bump=HAGB;G.note='💬 '+o.nm+' aceptó mejorar su oferta un '+Math.round(HAGB*100)+' %.'}else{G.offers[sl].splice(i,1);G.note='💬 '+o.nm+' se ofendió con la contraoferta y retiró su propuesta.'}rr()}
function spSign(sl,i){const o=G.offers[sl][i];if(!o)return;
  const slot=sl==0?'main':(!G.spon.s1?'s1':!G.spon.s2?'s2':null);
  if(!slot||G.spon[slot]){G.note=sl==0?'Ya tenés sponsor principal: rescindilo primero para firmar con otro.':'Ya tenés los dos sponsors pequeños: rescindí uno primero.';render();return}
  const c=calc(o),t=G.teams[G.me];
  G.spon[slot]={nm:o.nm,ic:o.ic,sl,f:c.f,b:c.b,ob:c.ob,tg:c.tg,dur:o.t.dur,cc:o.t.color?o.col:null};
  if(o.t.color){if(!t.c0)t.c0=t.c;t.c=o.col}
  G.offers[sl].splice(i,1);
  G.note='✍️ Firmaste con '+o.nm+' por '+o.t.dur+' temporada(s): '+f2d(c.f)+' M fijos por carrera.'+(o.t.color?' Tu auto ahora luce los colores de '+o.nm+'.':'');rr()}
function spRem(c){return G.phase=='market'||G.race>=CIRC.length?c.dur*CIRC.length:(CIRC.length-G.race)+(c.dur-1)*CIRC.length}
function spCancel(slot){const c=G.spon[slot];if(!c)return;const pen=.25*c.f*spRem(c);
  if(G.bud<pen){G.note='No alcanza el presupuesto para pagar la penalidad de '+f1(pen)+' M.';render();return}
  G.bud-=pen;G.spon[slot]=null;const t=G.teams[G.me];if(c.cc&&t.c0){t.c=t.c0;t.c0=null}
  G.note='Rescindiste a '+c.nm+' pagando '+f1(pen)+' M de penalidad.'+(c.cc?' Tu auto recupera su color original.':'');rr()}
function ageSpon(k){const p=G.P[k],t=G.teams[G.hum[k]];if(!p.spon)return;SLOTS.forEach(s=>{const c=p.spon[s];if(!c)return;c.dur--;
  if(c.dur<=0){p.spon[s]=null;if(c.cc&&t.c0){t.c=t.c0;t.c0=null}p.note=(p.note||'')+'Terminó tu contrato con '+c.nm+'. '+(c.cc?'Tu auto recupera su color original. ':'')}});genOffers(k)}
function loanTake(a,n){if(fin().free>=LN_TRIG)return;const pay=loanPay(a,n);if(oblig()+pay*n>LN_MAX+1e-9)return;
  G.bud+=a;G.loans.push({amt:a,n,left:n,pay,rate:loanRate()});
  G.note='🏦 El banco te prestó '+a+' M: '+n+' cuotas de '+f2d(pay)+' M por carrera. Las cuotas de lo que resta de la temporada se suman al presupuesto bloqueado.';rr()}
function hintFin(){const F=fin();return F.free<2?'<div class="sm neg" style="margin-top:6px">🔒 Sin margen para invertir: tu presupuesto está comprometido con gastos fijos (bloqueado '+f1(F.blk)+' M de '+f1(G.bud)+' M). '+(F.free<LN_TRIG?'Podés pedir un préstamo en Finanzas.':'')+'</div><div class="row" style="margin-top:4px">'+btnF(false,"setTab('fin')",'💰 Ir a Finanzas')+'</div>':'<div class="sm" style="margin-top:6px">🔓 Disponible para invertir: <b>'+f1(F.free)+' M</b> (bloqueado para gastos fijos: '+f1(F.blk)+' M).</div>'}
function offerH(sl,i,o){const c=calc(o),btn=btnF,S=sl+','+i;
  const dur=[1,2,3].map(n=>btn(o.t.dur==n,'spSet('+S+",'dur',"+n+')',n+(n==1?' temporada':' temporadas'),o.t.color&&n<2)).join('');
  const md=SPM.map((m,v)=>btn(o.t.mode==v,'spSet('+S+",'mode',"+v+')',m[0])).join('');
  const ob=SPO.map((x,v)=>btn(o.t.obj==v,'spSet('+S+",'obj',"+v+')',v?x[0]+' (≤ '+clp(o.r0+SPOR[v],1,11)+'º)':x[0])).join('');
  return '<div class="card" style="margin:8px 0"><h2>'+o.ic+' '+o.nm+(o.col?' '+dot(o.col):'')+(o.bump?' <span class="pos">· oferta mejorada</span>':'')+'</h2>'+
  '<div class="sm">Duración</div><div class="row">'+dur+'</div>'+
  '<div class="sm" style="margin-top:6px">Forma de pago</div><div class="row">'+md+'</div><div class="sm">'+SPM[o.t.mode][3]+'</div>'+
  '<div class="sm" style="margin-top:6px">Objetivo al cierre del campeonato de constructores</div><div class="row">'+ob+'</div><div class="sm">'+(o.t.obj?'Paga un bono si terminás en el puesto '+c.tg+'º o mejor, a cambio de un fijo algo menor.':'Sin condiciones: no hay bono final.')+'</div>'+
  (o.col?'<div class="sm" style="margin-top:6px">Imagen de marca</div><div class="row">'+btn(o.t.color,'spSet('+S+",'color',"+(!o.t.color)+')',(o.t.color?'✔ ':'')+'Repintar el auto de '+dot(o.col)+' (+'+Math.round(SPCOL*100)+' % fijo, mín. 2 temporadas)')+'</div>':'')+
  '<div style="margin:8px 0;padding:8px 10px;border:1px solid var(--bd);border-radius:6px"><b>'+f2d(c.f)+' M</b> fijos por carrera <span class="sm">('+f1(c.f*CIRC.length)+' M por temporada garantizados)</span> · <b>+'+f2d(c.b)+' M</b> por punto'+(c.ob?' · bono final <b>'+f1(c.ob)+' M</b> si terminás ≤ '+c.tg+'º':'')+'</div>'+
  '<div class="row">'+btn(false,'spSign('+S+')','✍️ Firmar')+btn(false,'spHag('+S+')','💬 Regatear (+'+Math.round(HAGB*100)+' %)',o.tried)+'</div>'+
  (o.tried?'':'<div class="sm">Regatear: '+Math.round(HAG*100)+' % de éxito; si sale mal, el sponsor retira su oferta. Solo se puede intentar una vez.</div>')+'</div>'}
function contractH(slot,sl){const c=G.spon[slot];
  if(!c)return '<div class="sm">'+(sl==0?'🏷️ Sponsor principal':'🏷️ Sponsor pequeño')+': <b>vacante</b> — elegí una oferta abajo.</div>';
  return '<div class="row" style="justify-content:space-between;margin:6px 0"><div>'+c.ic+' <b>'+c.nm+'</b> <span class="sm">· '+(sl==0?'principal':'pequeño')+' · quedan '+c.dur+' temp.'+(c.cc?' · auto '+dot(c.cc)+'repintado':'')+'<br>'+f2d(c.f)+' M fijos/carrera · +'+f2d(c.b)+' M por punto'+(c.ob?' · bono '+f1(c.ob)+' M si terminás ≤ '+c.tg+'º':'')+'</span></div>'+btnF(false,"spCancel('"+slot+"')",'Rescindir · '+f1(.25*c.f*spRem(c))+' M')+'</div>'}
function vFin(mk){const F=fin(),pct=G.bud>0?clp(F.blk/G.bud*100,0,100):100,N=CIRC.length;
  const free=F.free,cs=SLOTS.map((s,i)=>contractH(s,i?1:0)).join('');
  const offM=G.offers[0].map((o,i)=>offerH(0,i,o)).join(''),offS=G.offers[1].map((o,i)=>offerH(1,i,o)).join('');
  const canLoan=free<LN_TRIG,room=LN_MAX-oblig(),rate=loanRate();
  const ln=(G.loans||[]).map(l=>'<div class="sm">🏦 Préstamo de '+l.amt+' M · quedan '+l.left+' cuotas de '+f2d(l.pay)+' M</div>').join('');
  const lb=LN_AMT.map(a=>'<div class="row" style="margin:4px 0"><b style="min-width:60px">'+a+' M</b>'+LN_N.map(n=>{const pay=loanPay(a,n),blk=pay*Math.min(n,F.r);return btnF(false,'loanTake('+a+','+n+')',n+' cuotas × '+f2d(pay),!canLoan||oblig()+pay*n>LN_MAX+1e-9)}).join('')+'</div>').join('');
  let h=(mk?'':noteH())+'<div class="card"><h2>💰 Presupuesto y fondos bloqueados</h2>'+
  '<div class="row" style="justify-content:space-between"><div><div class="sm">Presupuesto total</div><b style="font-size:20px">$'+f1(G.bud)+' M</b></div><div><div class="sm">🔒 Bloqueado</div><b style="font-size:20px">$'+f1(F.blk)+' M</b></div><div><div class="sm">🔓 Disponible para D+I</div><b style="font-size:20px" class="'+(free>=0?'pos':'neg')+'">$'+f1(Math.max(0,free))+' M</b></div></div>'+
  '<div style="height:10px;border-radius:5px;background:var(--ok);margin:10px 0 6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--acc)"></div></div>'+
  '<div class="sm">'+(mk?'Vista previa de la próxima temporada ('+N+' carreras). ':'Hasta el final de la temporada quedan <b>'+F.r+'</b> carreras. ')+'Gastos fijos pendientes: sueldos <b>'+f1(F.wages)+' M</b> + gastos y academia <b>'+f1(F.gastos)+' M</b>'+(F.loan?' + cuotas de préstamos <b>'+f1(F.loan)+' M</b>':'')+' = <b>'+f1(F.gross)+' M</b>. Ingresos garantizados (TV/Federación + sponsors fijos): <b>−'+f1(F.guar)+' M</b>. Bloqueado: <b>'+f1(F.blk)+' M</b>. Los bonos por puntos y objetivos <b>no</b> cuentan: son un extra que te llega recién cuando ocurren.</div></div>'+
  '<div class="card"><h2>🤝 Mis sponsors</h2>'+cs+'<div class="sm">Sin sponsors cobrás solo los derechos de TV/Federación ('+f2d(TVB)+' M por carrera). Los sponsors pagan un fijo por carrera, un bono por cada punto y, si pactás objetivo, un bono al final del campeonato. Rescindir cuesta el 25 % del fijo que falta cobrar.</div></div>'+
  '<div class="card"><h2>📨 Ofertas de sponsor principal</h2><div class="sm">Pagan más, y el sponsor principal puede pedirte repintar el auto con sus colores.</div>'+(G.spon.main?'<div class="sm"><b>Ya tenés sponsor principal.</b></div>':(offM||'<div class="sm">No hay ofertas por ahora; llegan nuevas al cierre de la temporada.</div>'))+'</div>'+
  '<div class="card"><h2>📨 Ofertas de sponsors pequeños</h2>'+((G.spon.s1&&G.spon.s2)?'<div class="sm"><b>Tenés los dos lugares ocupados.</b></div>':(offS||'<div class="sm">No hay ofertas por ahora; llegan nuevas al cierre de la temporada.</div>'))+'</div>'+
  '<div class="card"><h2>🏦 Banco</h2><div class="sm">El banco solo presta a escuderías sin margen para invertir (disponible menor a '+LN_TRIG+' M). Tu tasa actual: <b>'+Math.round(rate*100)+' %</b> anual (mejora cuanto mejor ubicada esté tu escudería). Deuda máxima: '+LN_MAX+' M entre cuotas pendientes. Las cuotas se descuentan en cada carrera y las de lo que resta de la temporada se suman al presupuesto bloqueado, por eso un préstamo libera menos de lo que parece.</div>'+ln+
  (canLoan?(room>0?lb:'<div class="sm neg">Llegaste al límite de deuda.</div>'):'<div class="sm"><b>Todavía tenés margen para invertir ('+f1(free)+' M): el banco no te presta.</b></div>')+'</div>';
  return h}
function foot(){return '<div class="row" style="margin:14px 0"><button onclick="reset()">'+(resetArm?'¿Seguro? Tocá de nuevo para reiniciar':'Reiniciar partida')+'</button>'+(G.phase=='main'?'<button onclick="openEd()">✏️ Editor</button>':'')+(G.np>1&&!askLeave&&!shared()?'<button onclick="askLeave=true;render()">Abandonar partida</button>':'')+'</div>'+(G.np>1&&askLeave&&!shared()?leaveUI():'')}
// Al tocar una opción se vuelve a dibujar la pantalla: se conserva el scroll salvo que cambie de vista (fase, pestaña, turno, tramo de carrera o de clasificación).
let lastK=null;
const viewKey=()=>[G.phase,G.tab,edOpen,G.hold,G.cur,G.race,G.live?G.live.sec:'',G.q?G.q.seg:''].join('|');
function render(){const sy=window.scrollY||(document.documentElement&&document.documentElement.scrollTop)||0,k=viewKey();render0();if(k===lastK)window.scrollTo(0,sy);lastK=viewKey()}
function render0(){if(G.np>1&&G.hold&&TURNPH.includes(G.phase)){$('app').innerHTML=vHold();window.scrollTo(0,0);return}if(edOpen&&(G.phase=='start'||G.phase=='main')){$('app').innerHTML=vEdit();window.scrollTo(0,0);return}edOpen=false;const v=G.phase=='start'?vStart:G.phase=='main'?vMain:G.phase=='quali'?vQuali:G.phase=='grid'?vGrid:G.phase=='race'?vRace:G.phase=='result'?vResult:G.phase=='market'?vMarket:vEnd;$('app').innerHTML=v();window.scrollTo(0,0)}

// ===== Estadísticas anónimas de uso (Google Sheets + Apps Script) =====
// Envía: inicio de sesión, minutos activos (solo con la pestaña visible) y eventos de la partida.
// No se envía ningún dato personal: el jugador se identifica con un código al azar guardado en este navegador.
// Si ST_URL está vacío, no se envía nada.
const ST_URL='https://script.google.com/macros/s/AKfycby8cTnK8JijFFI6Fr_HbWiWxrkYSEOh3UcLh5zUKz1LRwWK-YA4goRE5u-v76yQFuwL/exec',ST_KEY='ddb-2026',ST_VER='DdB-1.2';
const stId=()=>'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const ST_PID=(()=>{try{let v=localStorage.getItem('ddb_pid');if(!v){v=stId();localStorage.setItem('ddb_pid',v)}return v}catch(e){return stId()}})(),ST_SID=stId();
function stSend(o){if(!ST_URL)return;try{const b=JSON.stringify(Object.assign({k:ST_KEY,pid:ST_PID,sid:ST_SID},o));
  fetch(ST_URL,{method:'POST',mode:'no-cors',keepalive:b.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:b}).catch(()=>{})}catch(e){}}
const ST_PH={main:'Fin de semana',quali:'Clasificación',grid:'Parrilla',race:'Carrera',result:'Resultado',market:'Mercado de pilotos',end:'Fin de temporada',start:'Inicio'};
function stCtx(){try{const t=G&&G.teams&&G.me!=null?G.teams[G.me]:null;return{club:t?t.n:'',s:G?G.s:'',w:G&&G.race!=null?G.race+1:'',n:G?G.np:'',mode:G?(ST_PH[G.phase]||G.phase):''}}catch(e){return{}}}
function stEv(ev,det){stSend(Object.assign({t:'ev',ev,det:det||''},stCtx()))}
stSend({t:'ses',dev:/iPad|Tablet/i.test(navigator.userAgent)||(/Android/i.test(navigator.userAgent)&&!/Mobile/i.test(navigator.userAgent))?'Tablet':/Mobi|Android|iPhone/i.test(navigator.userAgent)?'Celular':'Computadora',scr:screen.width+'x'+screen.height,lang:navigator.language||'',ver:ST_VER});
let stAct=0,stMin=0;
setInterval(()=>{if(document.visibilityState!=='visible')return;stAct+=15;const m=Math.floor(stAct/60);if(m>stMin){stMin=m;stSend({t:'hb',m})}},15000);
const stErrs=new Set();
function stErr(m){m=String(m||'').slice(0,250);if(!m||stErrs.has(m)||stErrs.size>=10)return;stErrs.add(m);stEv('error',m)}
window.addEventListener('error',e=>stErr((e.message||'Error')+(e.lineno?' (línea '+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>stErr('Promesa: '+(e.reason&&e.reason.message||e.reason)));
// Eventos de la partida (se envuelven funciones existentes sin cambiar su comportamiento)
(()=>{const o=pick;pick=function(){const ph=G.phase;o.apply(this,arguments);if(ph==='start'&&G.phase==='main')stEv('nueva_partida',(G.np>1?G.np+' managers':'1 manager'))}})();
(()=>{const o=finishRace;finishRace=function(){const c=(typeof CIRC!=='undefined'&&CIRC[G.race])?CIRC[G.race][0]:'';o.apply(this,arguments);stEv('carrera_terminada',c)}})();
(()=>{const o=newSeason;newSeason=function(){const s0=G.s;o.apply(this,arguments);if(G.s>s0)stEv('fin_temporada','Empieza la temporada '+G.s)}})();
// Secciones visitadas (cada una se registra una vez por sesión)
const stSec=new Set();
(()=>{const o=render;render=function(){o.apply(this,arguments);try{if(!G||G.phase==='start')return;
  const k=(typeof edOpen!=='undefined'&&edOpen)?'Editor':G.phase==='main'?(G.tab==='dr'?'Pilotos y Promesas':G.tab==='fin'?'Finanzas':'Fin de semana'):(ST_PH[G.phase]||G.phase);
  if(!stSec.has(k)){stSec.add(k);stEv('seccion',k)}}catch(e){}}})();

G=load()||fresh();if(!G.teams||!G.phase||(G.phase=='race'&&(!G.live||G.live.ent[0].skill==null))||(G.phase=='quali'&&!G.q)||(G.phase=='grid'&&!G.grid))G=fresh();if(!G.P){G.hum=G.me!=null?[G.me]:[];G.np=G.me!=null?1:0;G.names=['Jugador 1'];G.cur=0;G.P=[mkP()];PF.forEach(f=>G.P[0][f]=G[f])}if(G.hold==null)G.hold=false;if(!G.comp)G.comp=[1,1];if(!G.qpush)G.qpush=[1,1];if(!G.wx)G.wx=genWx();ensure();render();
try{if(G.phase!=='start')stEv('continuar_partida')}catch(e){}
</script>
